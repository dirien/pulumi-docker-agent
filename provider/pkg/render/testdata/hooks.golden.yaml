version: "16"
agents:
  root:
    model: openai/gpt-5-mini
    routing:
      allowed_agents:
        - quick
        - expert
      default_agent: expert
    hooks:
      pre_tool_use:
        - matcher: shell
          hooks:
            - type: command
              command: ./scripts/check.sh
              args:
                - --strict
              timeout: 30
              env:
                MODE: ci
              on_error: block
      post_tool_use:
        - matcher: '*'
          hooks:
            - type: command
              command: echo done
      session_start:
        - type: builtin
          command: add_environment_info
      stop:
        - type: model
          model: openai/gpt-5-mini
          prompt: Was the answer complete?
      before_agent_run:
        - type: evaluator
          evaluator: route
          routing_policy:
            routes:
              complex: expert
              simple: quick
            min_probability: 0.7
  quick:
    model: openai/gpt-5-mini
    description: Answers simple questions
  expert:
    model: openai/gpt-5
    description: Handles everything else
evaluators:
  route:
    provider: openai
    model: gpt-5-mini
    instructions: Classify the request.
    type: choice
    choices:
      complex: Anything else.
      simple: A direct question.
    timeout: 30s
