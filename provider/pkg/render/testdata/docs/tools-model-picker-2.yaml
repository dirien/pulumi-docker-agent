# Verbatim from https://docs.docker.com/ai/docker-agent/tools/model-picker/ (tools-model-picker__2.yaml)
agents:
  root:
    model: openai/gpt-5-mini  # Default model
    instruction: |
      You are a helpful assistant. For simple questions, use gpt-5-mini.
      For complex reasoning or coding tasks, switch to claude-sonnet-4-5 or gpt-5.
    toolsets:
      - type: model_picker
        models:
          - openai/gpt-5-mini
          - anthropic/claude-sonnet-4-5
          - openai/gpt-5
