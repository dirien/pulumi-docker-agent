# Verbatim from https://docs.docker.com/ai/docker-agent/tools/scheduler/ (tools-scheduler__2.yaml)
agents:
  root:
    model: openai/gpt-5-mini
    description: A monitoring assistant
    instruction: |
      Every 15 minutes, run `git fetch` and tell me if origin/main moved.
    toolsets:
      - type: scheduler
      - type: shell
