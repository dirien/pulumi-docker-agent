# Verbatim from https://docs.docker.com/ai/docker-agent/providers/custom/ (providers-custom__1.yaml)
providers:
  my_gateway:
    base_url: https://api.example.com/v1
    token_key: MY_API_KEY

models:
  my_model:
    provider: my_gateway
    model: gpt-4o

agents:
  root:
    model: my_model
    instruction: You are a helpful assistant.
