# Wrapped fragment from https://docs.docker.com/ai/docker-agent/tools/fetch/ (tools-fetch__3.fragment.yaml): the toolset fragment is put into a minimal agent.
agents:
  root:
    model: openai/gpt-5-mini
    toolsets:
      - type: fetch
        allowed_domains:
          - docs.internal.example.com
        headers:
          Authorization: "Bearer ${env.INTERNAL_DOCS_TOKEN}"
          X-Internal-Client: "docker-agent"
