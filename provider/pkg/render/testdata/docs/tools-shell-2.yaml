# Wrapped fragment from https://docs.docker.com/ai/docker-agent/tools/shell/ (tools-shell__2.fragment.yaml): the toolset fragment is put into a minimal agent.
agents:
  root:
    model: openai/gpt-5-mini
    toolsets:
      - type: shell
        env:
          MY_VAR: "value"
          PATH: "${env.PATH}:/custom/bin"
