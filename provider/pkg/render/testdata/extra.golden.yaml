version: "16"
agents:
  root:
    model: openai/gpt-5-mini
    description: overridden by extra
    toolsets:
      - type: filesystem
        ignore_vcs: false
        post_edit:
          - cmd: gofmt -w ${file}
            path: '*.go'
    code_mode_tools: true
    max_consecutive_tool_calls: 10
models:
  m:
    provider: openai
    model: gpt-5
    cost:
      input: 1.25
      output: 10
future_limit: 2.5
future_section:
  search:
    ref: docker:duckduckgo
