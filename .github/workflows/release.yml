name: release

# Tag vX.Y.Z on main to release:
#   1. GoReleaser builds the six plugin archives, checksums, cosign bundle and SBOMs
#      and publishes them as a GitHub release (the Pulumi Registry reads this).
#   2. The Go SDK module is tagged sdk/vX.Y.Z on the same commit.
#   3. The npm, PyPI and NuGet SDKs are built from the committed sources with the
#      release version injected, and published.
on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PULUMI_SKIP_UPDATE_CHECK: "true"
  PUBLISH_NPM: "true"
  PUBLISH_PYPI: "true"
  PUBLISH_NUGET: "true"

jobs:
  publish_binary:
    name: Publish provider binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub release + sdk/vX.Y.Z tag
      id-token: write # cosign keyless signing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser needs the full history for the changelog
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag Go SDK module (sdk/vX.Y.Z)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const ref = `refs/tags/sdk/${context.ref.replace('refs/tags/', '')}`;
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
                sha: context.sha,
              });
              core.info(`created ${ref} at ${context.sha}`);
            } catch (err) {
              if (err.status === 422) {
                core.warning(`${ref} already exists; leaving it untouched`);
              } else {
                throw err;
              }
            }

  publish_sdk:
    name: Publish ${{ matrix.language }} SDK
    needs: publish_binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance (and PyPI trusted publishing, if enabled)
    strategy:
      fail-fast: false
      matrix:
        language:
          - nodejs
          - python
          - dotnet
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set PROVIDER_VERSION from the tag
        run: echo "PROVIDER_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum
      - name: Install pulumictl
        uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
        with:
          repo: pulumi/pulumictl
          tag: v0.0.50
      - name: Install Pulumi CLI
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version-file: .pulumi.version
      - name: Setup Node
        if: matrix.language == 'nodejs'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
      - name: Setup Python
        if: matrix.language == 'python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Setup .NET
        if: matrix.language == 'dotnet'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Build SDK
        run: make build_${{ matrix.language }} PROVIDER_VERSION="${PROVIDER_VERSION}"
      - name: Check worktree clean (committed SDK must match codegen)
        run: |
          git update-index -q --refresh
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the committed SDK does not match codegen; refusing to publish"
            git status --porcelain
            git --no-pager diff --stat
            exit 1
          fi

      - name: Publish to npm
        if: matrix.language == 'nodejs' && env.PUBLISH_NPM == 'true'
        working-directory: sdk/nodejs/bin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          tag_args=()
          if [[ "${PROVIDER_VERSION}" == *-* ]]; then tag_args=(--tag dev); fi
          npm publish --access public --provenance "${tag_args[@]}"

      - name: Publish to PyPI
        if: matrix.language == 'python' && env.PUBLISH_PYPI == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: sdk/python/bin/dist
          # PyPI API token (user __token__), as in dirien/pulumi-fly. Remove this line to
          # switch to PyPI Trusted Publishing once the project is configured on pypi.org.
          password: ${{ secrets.PYPI_PASSWORD }}
          skip-existing: true

      - name: Publish to NuGet
        if: matrix.language == 'dotnet' && env.PUBLISH_NUGET == 'true'
        env:
          NUGET_PUBLISH_KEY: ${{ secrets.NUGET_PUBLISH_KEY }}
        run: |
          dotnet nuget push "sdk/dotnet/bin/Debug/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${NUGET_PUBLISH_KEY}" \
            --skip-duplicate
