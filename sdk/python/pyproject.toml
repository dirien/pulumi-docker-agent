[project]
  name = "ediri_docker_agent"
  description = "A Pulumi provider for Docker Agent (docker-agent): define AI agent configurations as typed, validated code and share them as OCI artifacts, the same way `docker agent share push` does."
  dependencies = ["packaging>=24.0", "pulumi>=3.231.0,<4.0.0", "semver>=2.8.1", "typing-extensions>=4.11,<5; python_version < \"3.11\""]
  keywords = ["pulumi", "docker", "docker-agent", "cagent", "ai", "agents", "genai", "llm", "mcp", "oci", "category/utility", "kind/native"]
  readme = "README.md"
  requires-python = ">=3.9"
  version = "0.0.0"
  [project.license]
    text = "Apache-2.0"
  [project.urls]
    Homepage = "https://github.com/dirien/pulumi-docker-agent"
    Repository = "https://github.com/dirien/pulumi-docker-agent"

[build-system]
  requires = ["setuptools>=61.0"]
  build-backend = "setuptools.build_meta"

[tool]
  [tool.setuptools]
    [tool.setuptools.package-data]
      ediri_docker_agent = ["py.typed", "pulumi-plugin.json"]
