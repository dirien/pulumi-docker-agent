plugins {
    id "application"
}

repositories {
    maven { // The google mirror is less flaky than mavenCentral()
        url = "https://maven-central.storage-download.googleapis.com/maven2/"
    }
    mavenCentral()
}

dependencies {
    implementation "com.pulumi:pulumi:1.37.4"
    implementation "io.github.dirien:docker-agent:0.1.0"
}

application {
    // The Pulumi Java language host runs other main classes (plugin discovery) with -PmainClass.
    mainClass = project.hasProperty("mainClass") ? project.getProperty("mainClass") : "example.App"
}
