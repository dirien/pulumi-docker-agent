version: "16"
metadata:
  description: Demonstrates per-toolset lifecycle profiles (strict / resilient / best-effort)
agents:
  root:
    model: openai/gpt-5.6-terra
    description: An example agent that demonstrates per-toolset lifecycle policies.
    instruction: |
      Use the configured tools to answer questions.
    toolsets:
      - type: lsp
        command: gopls
        file_types:
          - .go
        lifecycle:
          profile: strict
          startup_timeout: 30s
      - type: mcp
        ref: docker:context7
        lifecycle:
          profile: resilient
          max_restarts: 10
          backoff:
            initial: 500ms
            max: 1m
            multiplier: 2.0
            jitter: 0.2
      - type: mcp
        ref: docker:openbnb-airbnb
        lifecycle:
          profile: best-effort
models:
  openai/gpt-5.6-terra:
    provider: openai
    model: gpt-5.6-terra
