version: "16"
agents:
  root:
    model: nemotron3
    description: Assistant whose model id comes from the environment
    instruction: |
      You are a helpful AI assistant.
    toolsets:
      - type: filesystem
      - type: shell
models:
  nemotron3:
    provider: dmr
    model: ${env.NEMOTRON3_MODEL}
    base_url: ${env.DMR_BASE_URL}
