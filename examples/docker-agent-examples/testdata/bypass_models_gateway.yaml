version: "16"
agents:
  root:
    model: direct-model
    description: Assistant whose model bypasses the models gateway
    instruction: You are a helpful assistant.
    sub_agents:
      - proxied
  proxied:
    model: proxied-model
    description: Assistant whose custom endpoint implies the gateway bypass
    instruction: You are a helpful assistant.
models:
  direct-model:
    provider: anthropic
    model: claude-sonnet-5
    bypass_models_gateway: true
  gateway-model:
    provider: openai
    model: gpt-5.6-sol
  proxied-model:
    provider: openai
    model: gpt-5.6-sol
    base_url: https://proxy.internal.example.com/v1
