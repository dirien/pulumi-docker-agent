version: "16"
agents:
  root:
    model: fast-gpt
    description: An assistant using OpenAI Fast mode.
    instruction: You are a helpful assistant.
models:
  fast-gpt:
    provider: openai
    model: gpt-5.6
    provider_opts:
      service_tier: fast
  ultrafast-astra:
    provider: openai
    model: gpt-6-astra
    provider_opts:
      service_tier: ultrafast
