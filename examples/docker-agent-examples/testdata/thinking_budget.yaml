version: "16"
agents:
  root:
    model: gpt-5-mini-min
    description: a helpful assistant that thinks
    instruction: you are a helpful assistant who can also use tools, but only if you need to
    toolsets:
      - type: shell
    commands:
      demo: hey i need python code for a mandelbrot fractal
models:
  bedrock-opus-4-8-adaptive:
    provider: amazon-bedrock
    model: global.anthropic.claude-opus-4-8
    thinking_budget: adaptive/high
  claude-4-6-sonnet-high:
    provider: anthropic
    model: claude-sonnet-4-6
    thinking_budget: 32768
    provider_opts:
      interleaved_thinking: true
  claude-4-6-sonnet-min:
    provider: anthropic
    model: claude-sonnet-4-6
    thinking_budget: 1024
  claude-opus-4-8-adaptive:
    provider: anthropic
    model: claude-opus-4-8
    thinking_budget: adaptive
  claude-opus-4-8-low:
    provider: anthropic
    model: claude-opus-4-8
    thinking_budget: low
  claude-opus-4-8-summarized:
    provider: anthropic
    model: claude-opus-4-8
    thinking_budget: adaptive
    provider_opts:
      thinking_display: summarized
  gemini-2-5-flash-dynamic-thinking:
    provider: google
    model: gemini-2.5-flash
    thinking_budget: -1
  gemini-2-5-flash-high:
    provider: google
    model: gemini-2.5-flash
    thinking_budget: 24576
  gemini-2-5-flash-low:
    provider: google
    model: gemini-2.5-flash
    thinking_budget: 1024
  gemini-2-5-flash-no-thinking:
    provider: google
    model: gemini-2.5-flash
    thinking_budget: 0
  gpt-5-6-max:
    provider: openai
    model: gpt-5.6
    thinking_budget: max
  gpt-5-6-none:
    provider: openai
    model: gpt-5.6
    thinking_budget: none
  gpt-5-mini-high:
    provider: openai
    model: gpt-5-mini
    thinking_budget: high
  gpt-5-mini-min:
    provider: openai
    model: gpt-5-mini
    thinking_budget: minimal
