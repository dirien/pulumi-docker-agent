version: "16"
agents:
  root:
    model: anthropic/claude-haiku-4-5
    description: Shell agent demonstrating the safety modes
    welcome_message: |
      Every shell command is classified (safe / destructive / unknown)
      and gated by the session's safety mode:

        strict      — ask for every tool call
        balanced    — safe commands run silently; destructive and
                      unknown commands ask
        restricted  — safe commands run silently; destructive and
                      unknown commands are denied without asking
                      (fail-closed, for unattended runs)
        autonomous  — everything runs (legacy --yolo); only custom
                      deny/ask rules still gate

      This config declares `runtime.safety: balanced`, so fresh sessions
      start balanced unless you choose otherwise (`--safety`, `--yolo`,
      an alias option, or `settings.safety` in your user config). The
      `auditor` agent overrides the config default with `safety: strict`,
      and `ci` with `safety: restricted`. You can still escalate from a
      confirmation prompt ([B] balanced, [A] autonomous). Custom
      permissions rules (see permissions.yaml) always win over the mode.
    instruction: Use the shell tool to run the command the user asks for.
    toolsets:
      - type: shell
  auditor:
    model: anthropic/claude-haiku-4-5
    description: Read-oriented agent that asks before every tool call
    instruction: |
      Inspect the system with the shell tool. Prefer read-only commands and explain what each command does before running it.
    toolsets:
      - type: shell
    safety: strict
  ci:
    model: anthropic/claude-haiku-4-5
    description: Headless agent that denies unmatched calls instead of prompting (restricted mode)
    instruction: |
      Run the checks the user asks for with the shell tool. If a command is denied, report it instead of working around the denial.
    toolsets:
      - type: shell
    safety: restricted
runtime:
  safety: balanced
