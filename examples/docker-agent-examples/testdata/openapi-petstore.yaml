version: "16"
agents:
  root:
    model: openai/gpt-4o
    description: Pet Store assistant powered by OpenAPI tools
    welcome_message: "\U0001F43E Welcome to the Pet Store!\n\nI can help you manage pets using the Pet Store API. Try asking me to:\n- List all available pets\n- Add a new pet\n- Look up a specific pet\n\nWhat would you like to do?\n"
    instruction: |
      You are a helpful Pet Store assistant.
      You have access to the Pet Store API and can help users manage pets.

      Available actions:
      - List pets with optional filtering
      - Create new pets
      - Look up pets by ID

      Always confirm with the user before creating or modifying data.
    toolsets:
      - type: openapi
        url: https://petstore3.swagger.io/api/v3/openapi.json
