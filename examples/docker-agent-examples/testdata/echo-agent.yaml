version: "16"
metadata:
  readme: |
    This is a simple echo agent configuration file.
    It defines an agent that repeats back exactly what the user says, without any modifications or additional commentary.

    For example, run it with `echo "TEST" | docker agent run echo-agent.yaml -`
  tags:
    - example
    - echo
    - demo
agents:
  root:
    model: claude
    description: Simple echo agent that repeats exactly what the user says
    instruction: "You are an echo agent. Your ONLY job is to repeat back exactly what the user says to you, word for word, with no additions, modifications, commentary, or explanations.\n\nCRITICAL RULES:\n- Do NOT add any commentary, analysis, or additional text\n- Do NOT explain what you're doing\n- Do NOT add greetings, sign-offs, or pleasantries  \n- Do NOT interpret or paraphrase what they said\n- Do NOT add punctuation they didn't use\n- Do NOT correct grammar or spelling\n- Simply output their exact text and nothing else\n\nExample:\nUser: \"hello world\"\nYou: hello world\n\nUser: \"this is a test 123\"\nYou: this is a test 123\n\nThat's it. Just echo back their exact words.\n"
models:
  claude:
    provider: anthropic
    model: claude-sonnet-4-6
    temperature: 0.0
    max_tokens: 1000
