version: "16"
agents:
  root:
    model: llava-local
    description: Assistant on a local Ollama vision model with declared image support
    instruction: You are a helpful assistant. Describe any images the user attaches.
models:
  llava-local:
    provider: ollama
    model: llava
    capabilities:
      image: true
      pdf: false
  proxy-multimodal:
    provider: vision-proxy
    model: gemini-2.5-pro
    capabilities:
      image: true
      pdf: true
      audio: true
      video: true
  proxy-vision:
    provider: vision-proxy
    model: gpt-4o
    capabilities:
      image: true
      pdf: true
providers:
  ollama:
    base_url: http://localhost:11434/v1
  vision-proxy:
    api_type: openai_chatcompletions
    base_url: https://llm.internal.example.com/v1
    token_key: MY_PROXY_API_KEY
