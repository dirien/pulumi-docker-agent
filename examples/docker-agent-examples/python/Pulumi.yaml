name: docker-agent-examples-python
runtime:
  name: python
  options:
    toolchain: pip
    virtualenv: venv
description: Every example configuration of docker-agent as a typed AgentConfig (generated, see ../README.md).
plugins:
  # Use the provider binary built by `make provider` in this repository. Remove this
  # block when you copy the program elsewhere; the SDK then downloads the released plugin.
  providers:
    - name: docker-agent
      path: ../../../bin
