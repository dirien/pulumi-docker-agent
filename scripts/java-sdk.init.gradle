//
// Gradle init script for the generated Java SDK in sdk/java. `make build_java` and the release
// workflow pass it to every Gradle run on the SDK:
//
//   cd sdk/java && gradle --init-script ../../scripts/java-sdk.init.gradle ...
//   gradle -p sdk/java --init-script "${GITHUB_WORKSPACE}/scripts/java-sdk.init.gradle" ...
//
// Gradle resolves a relative --init-script path against the project directory (-p), not the
// working directory, so `gradle -p sdk/java --init-script scripts/java-sdk.init.gradle` fails
// with "The specified initialization script ... does not exist".
//
// sdk/java/build.gradle comes from `pulumi package gen-sdk` and is regenerated by `make codegen`,
// so these settings are applied from outside the build:
//
// - The POM gets a project name, a developer, an inception year and Maven SCM URLs. pulumi-java
//   fills these in only for packages that Pulumi publishes and leaves them empty otherwise, and
//   Maven Central rejects a POM without a project name and developer information
//   (https://central.sonatype.org/publish/requirements/#required-pom-metadata).
// - Javadoc reads the sources as UTF-8, whatever the locale of the build machine: the schema
//   descriptions contain non-ASCII characters, and the javadoc jar is required for Central.

def pomName = "Pulumi Docker Agent provider"
def inceptionYear = "2026"
def developer = [id: "dirien", name: "Engin Diri", url: "https://github.com/dirien"]
def scm = [
    connection         : "scm:git:https://github.com/dirien/pulumi-docker-agent.git",
    developerConnection: "scm:git:ssh://git@github.com/dirien/pulumi-docker-agent.git",
    url                : "https://github.com/dirien/pulumi-docker-agent",
]

// Helpers for the POM's XML nodes, with or without a namespace.
def localName = { node -> node.name() instanceof String ? node.name() : node.name().localPart }
def child = { parent, String name -> parent.children().find { it instanceof Node && localName(it) == name } }
// Returns parent/name, creating the element in the parent's namespace if it is missing.
def ensureChild = { parent, String name ->
    def node = child(parent, name)
    if (node == null) {
        def qname = parent.name()
        node = new Node(parent, qname instanceof String ? name : qname.getClass().newInstance(qname.namespaceURI, name), [])
    }
    node
}
def setText = { parent, String name, String value -> ensureChild(parent, name).value = value }

allprojects {
    tasks.withType(Javadoc).configureEach {
        options.encoding = "UTF-8"
        options.docEncoding = "UTF-8"
        options.charSet = "UTF-8"
    }

    plugins.withId("maven-publish") {
        publishing.publications.withType(MavenPublication).configureEach {
            pom.withXml {
                def root = asNode()
                if (!child(root, "name")?.text()) {
                    setText(root, "name", pomName)
                }
                if (!child(root, "inceptionYear")?.text()) {
                    setText(root, "inceptionYear", inceptionYear)
                }
                // Replace the empty <developer> of the generated build.gradle.
                def developers = ensureChild(root, "developers")
                developers.children().findAll { it instanceof Node && !child(it, "name")?.text() }.each { developers.remove(it) }
                if (!developers.children().any { it instanceof Node }) {
                    def entry = ensureChild(developers, "developer")
                    developer.each { key, value -> setText(entry, key, value) }
                }
                def scmNode = ensureChild(root, "scm")
                scm.each { key, value -> setText(scmNode, key, value) }
            }
        }
    }
}
